services:
  - type: web
    name: attendx
    env: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: QR_SECRET
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SEED_FACULTY_PASSWORD
        sync: false
      - key: SEED_STUDENT_PASSWORD
        sync: false
      - key: PORT
        value: 8080
      - key: ASPNETCORE_URLS
        value: http://0.0.0.0:8080
