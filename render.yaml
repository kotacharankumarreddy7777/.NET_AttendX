services:
  - type: web
    name: attendx
    env: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /health/live
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: QR_SECRET
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SEED_FACULTY_PASSWORD
        sync: false
      - key: SEED_STUDENT_PASSWORD
        sync: false
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://0.0.0.0:8080
      - key: PORT
        value: 8080
      - key: DATA_PROTECTION_KEYS
        value: /data/keys
    disk:
      name: attendx-keys
      mountPath: /data
      sizeGB: 1
