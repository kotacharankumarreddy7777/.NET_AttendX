version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: attendx-db
    environment:
      POSTGRES_DB: AttendXDb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - attendx_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  attendx:
    build: .
    container_name: attendx-web
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=AttendXDb;Username=postgres;Password=postgres;
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  attendx_db_data:
